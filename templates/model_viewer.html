<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIหน้าฮ่าน 3D Navigator</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Sarabun', sans-serif; }
        #viewer { width: 100vw; height: 100vh; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .pin {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff4444;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.3s;
        }
        .pin:hover {
            transform: translate(-50%, -50%) scale(1.3);
            background: #ff6666;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div id="info">
        <strong>AIหน้าฮ่าน 3D Navigator</strong><br>
        กำลังโหลดโมเดล...
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(50, 30, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('viewer').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        dirLight.position.set(50, 50, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Grid helper
        const gridHelper = new THREE.GridHelper(100, 20, 0x888888, 0xcccccc);
        scene.add(gridHelper);

            { zone: 'A', sections: '4',shelves: '7',x: -27, y: 6, z: 34, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'A', sections: '5',shelves: '8',x: -27, y: 6, z: 26, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'B', sections: '1',shelves: '1',x: -27, y: 6, z: 16, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'B', sections: '2',shelves: '2',x: -27, y: 6, z: 8, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'B', sections: '2',shelves: '3',x: -27, y: 6, z: 4, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'B', sections: '3',shelves: '4',x: -27, y: 6, z: -4, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'B', sections: '3',shelves: '5',x: -27, y: 6, z: -6, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'B', sections: '4',shelves: '6',x: -27, y: 6, z: -13, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'B', sections: '4',shelves: '7',x: -27, y: 6, z: -17, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'B', sections: '5',shelves: '8',x: -27, y: 6, z: -25, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'C', sections: '1',shelves: '1',x: -27, y: 6, z: -33, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'C', sections: '2',shelves: '2',x: -27, y: 6, z: -41, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'C', sections: '2',shelves: '3',x: -27, y: 6, z: -44, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'C', sections: '3',shelves: '4',x: -27, y: 6, z: -53, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'C', sections: '3',shelves: '5',x: -27, y: 6, z: -55, w: 20, h: 9, d: 2, color: 0x00FF00 },

            { zone: 'C', sections: '4',shelves: '7',x: -27, y: 6, z: -66, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'C', sections: '5',shelves: '8',x: -27, y: 6, z: -73, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'D', sections: '1',shelves: '1',x: 12, y: 6, z: -35, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'D', sections: '2',shelves: '2',x: 12, y: 6, z: -42, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'D', sections: '2',shelves: '3',x: 12, y: 6, z: -46, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'D', sections: '3',shelves: '4',x: 12, y: 6, z: -54, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'D', sections: '3',shelves: '5',x: 12, y: 6, z: -57, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'D', sections: '4',shelves: '6',x: 12, y: 6, z: -64, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'D', sections: '4',shelves: '7',x: 12, y: 6, z: -67, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'D', sections: '5',shelves: '8',x: 12, y: 6, z: -74, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'E', sections: '1',shelves: '1',x: 12, y: 6, z: 14, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'E', sections: '2',shelves: '2',x: 12, y: 6, z: 7, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'E', sections: '2',shelves: '3',x: 12, y: 6, z: 3, w: 20, h: 9, d: 2, color: 0x00FF00 },

            { zone: 'E', sections: '3',shelves: '5',x: 12, y: 6, z: -8, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'E', sections: '4',shelves: '6',x: 12, y: 6, z: -15, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'E', sections: '4',shelves: '7',x: 12, y: 6, z: -18, w: 20, h: 9, d: 2, color: 0x00FF00 },
            { zone: 'E', sections: '1',shelves: '8',x: 12, y: 6, z: -25, w: 20, h: 9, d: 2, color: 0x00FF00 },
        ];
        
        shelves.forEach(box => {
            const geometry = new THREE.BoxGeometry(box.w, box.h, box.d);
            const edges = new THREE.EdgesGeometry(geometry);
            const material = new THREE.LineBasicMaterial({ color: box.color, linewidth: 1 });
            const wireframe = new THREE.LineSegments(edges, material);
            wireframe.position.set(box.x, box.y, box.z);
            scene.add(wireframe);
        });

        // Section boxes (สีเทา)
        // Zone labels
        const zones = [
    { name: 'A', x: -27, y: 15, z: 46 },
    { name: 'B', x: -27, y: 15, z: -4.5 },
    { name: 'C', x: -27, y: 15, z: -53 },
    { name: 'D', x: 12, y: 15, z: -53 },
    { name: 'E', x: 12, y: 15, z: -4.5 }
];

zones.forEach((zone) => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 256;
    canvas.height = 128;

    ctx.fillStyle = '#ff4d00';
    ctx.font = 'bold 80px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`Zone ${zone.name}`, 128, 90);

    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture });

    const sprite = new THREE.Sprite(material);

    // Manual position
    sprite.position.set(zone.x, zone.y, zone.z);

    sprite.scale.set(8, 4, 1);

    scene.add(sprite);
});

        // Product pins
        const pins = new THREE.Group();
        scene.add(pins);

        // Load GLB model
        const loader = new GLTFLoader();
        loader.load('/public/Naharn_3D.glb', (gltf) => {
            scene.add(gltf.scene);
            document.getElementById('info').innerHTML = '<strong>AIหน้าฮ่าน 3D Navigator</strong><br>พร้อมใช้งาน';
        }, undefined, (error) => {
            console.error('Error loading model:', error);
            document.getElementById('info').innerHTML = '<strong>Error</strong><br>ไม่สามารถโหลดโมเดลได้';
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // API for Python bridge
        window.mall3D = {
            addPin: (id, x, y, z, name) => {
                const geometry = new THREE.SphereGeometry(0.3, 16, 16);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0xff4444,
                    emissive: 0xff0000,
                    emissiveIntensity: 0.5
                });
                const pin = new THREE.Mesh(geometry, material);
                pin.position.set(x, y, z);
                pin.userData = { id, name };
                pins.add(pin);
                return pin;
            },
            
            clearPins: () => {
                while(pins.children.length > 0) {
                    pins.remove(pins.children[0]);
                }
            },
            
            focusOn: (x, y, z, duration = 1000) => {
                const start = {
                    x: camera.position.x,
                    y: camera.position.y,
                    z: camera.position.z,
                    tx: controls.target.x,
                    ty: controls.target.y,
                    tz: controls.target.z
                };
                const end = {
                    x: x + 10,
                    y: y + 10,
                    z: z + 10,
                    tx: x,
                    ty: y,
                    tz: z
                };
                
                const startTime = Date.now();
                function animateCamera() {
                    const elapsed = Date.now() - startTime;
                    const t = Math.min(elapsed / duration, 1);
                    const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                    
                    camera.position.x = start.x + (end.x - start.x) * eased;
                    camera.position.y = start.y + (end.y - start.y) * eased;
                    camera.position.z = start.z + (end.z - start.z) * eased;
                    
                    controls.target.x = start.tx + (end.tx - start.tx) * eased;
                    controls.target.y = start.ty + (end.ty - start.ty) * eased;
                    controls.target.z = start.tz + (end.tz - start.tz) * eased;
                    
                    if (t < 1) requestAnimationFrame(animateCamera);
                }
                animateCamera();
            }
        };

        console.log('3D Viewer ready. API: window.mall3D');

</body>
</html>
